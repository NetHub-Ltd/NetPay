apiVersion: apps/v1
kind: Deployment
metadata:
  name: nethub-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: nethub-gateway }
  template:
    metadata:
      labels: { app: nethub-gateway }
    spec:
      containers:
        - name: api
          image: ghcr.io/nethub-ltd/netpay:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: nethub-gateway-secrets } }]
          env:
            - { name: ENVIRONMENT, value: production }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nethub-gateway-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: nethub-gateway-worker }
  template:
    metadata:
      labels: { app: nethub-gateway-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/nethub-ltd/netpay:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.worker"]
          envFrom: [{ secretRef: { name: nethub-gateway-secrets } }]
          env:
            - { name: ENVIRONMENT, value: production }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: nethub-gateway
spec:
  selector: { app: nethub-gateway }
  ports: [{ port: 80, targetPort: 8000 }]
---
# FastAPI ingress is limited to API and Safaricom callback traffic. The browser
# application is hosted independently on Vercel; do not route frontend paths here.
# Keep /internal/* private. NGINX ingress supports WebSocket upgrades when a
# dedicated authenticated realtime service is introduced for a concrete use case.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netpay-public
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: pay.nethub.co.ke
      http:
        paths:
          - path: /callbacks/mpesa
            pathType: Prefix
            backend:
              service:
                name: nethub-gateway
                port: { number: 80 }
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: nethub-gateway
                port: { number: 80 }
