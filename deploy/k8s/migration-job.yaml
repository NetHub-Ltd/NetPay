apiVersion: batch/v1
kind: Job
metadata:
  name: nethub-gateway-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: nethub-gateway-migrate }
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/nethub-ltd/netpay:latest
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          envFrom: [{ secretRef: { name: nethub-gateway-secrets } }]
          env:
            - { name: ENVIRONMENT, value: production }
