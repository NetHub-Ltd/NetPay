services:
  migrate:
    image: nethub/netpay-api:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@db:5432/gateway
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: nethub/netpay-api:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@db:5432/gateway
      ENVIRONMENT: development
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5

  frontend:
    image: nethub/netpay-frontend:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    env_file:
      - ../backend/.env
      - ../frontend/.env.local
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NETPAY_BACKEND_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  worker:
    image: nethub/netpay-api:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@db:5432/gateway
      ENVIRONMENT: development
      MPESA_PUBLIC_BASE_URL: http://localhost:8000
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
