[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netpay-backend"
version = "0.2.0"
description = "NetPay payment gateway API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic-settings>=2.6,<3.0", "sqlmodel>=0.0.22,<1.0", "sqlalchemy>=2.0.36,<3.0", "greenlet>=3.1.0", "asyncpg>=0.30,<1.0", "psycopg[binary]>=3.2,<4.0", "alembic>=1.14,<2.0", "redis>=5.2,<7.0", "loguru>=0.7,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<2.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["smoke_tests"]
addopts = "-ra"
asyncio_mode = "auto"
