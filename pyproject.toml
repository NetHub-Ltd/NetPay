[project]
name = "nethub-payment-gateway"
version = "1.1.0"
description = "Multi-tenant M-Pesa payment gateway — FastAPI, Daraja STK/C2B, signed webhooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlmodel>=0.0.22",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.9",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "pydantic[email]>=2.9.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "loguru>=0.7.2",
  "redis>=5.2.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.0,<4.1",
  "python-multipart>=0.0.12",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0"]

[tool.uv]
dev-dependencies = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
