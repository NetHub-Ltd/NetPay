name: Release

# On every push to main (after tests):
#   1. Bump patch version from latest v* tag (or pyproject.toml)
#   2. Create annotated tag vX.Y.Z (no manual tags required)
#   3. Multi-arch build + push to GHCR
#   4. GitHub Release with changelog-style notes
#
# Skip: commit message contains [skip release]
# Images are NOT published from feature branches (see ci.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -U pip
          pip install -e ".[dev]"
      - name: Startup smoke tests (fresh suite only)
        env:
          DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost:5432/gateway
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: startup-test-secret
          ENVIRONMENT: test
        run: pytest -q smoke_tests/test_startup.py

  frontend-lint:
    uses: ./.github/workflows/frontend-lint.yml

  frontend-build:
    uses: ./.github/workflows/frontend-build.yml

  version:
    needs: [backend, frontend-lint, frontend-build]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      skip: ${{ steps.bump.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide version and create tag
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if echo "${COMMIT_MSG:-}" | grep -q '\[skip release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Skipping release: [skip release] in commit message"
            exit 0
          fi

          # Already tagged at this commit?
          if git describe --exact-match --tags HEAD 2>/dev/null | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Skipping release: HEAD already has a version tag"
            exit 0
          fi

          py_ver="$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml','rb'))['project']['version'])" 2>/dev/null || echo "1.1.0")"
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
          if [ -z "${latest}" ]; then
            base="$py_ver"
          else
            base="${latest#v}"
          fi

          IFS=. read -r major minor patch <<EOF
          ${base}
          EOF
          major=${major:-1}
          minor=${minor:-0}
          patch=${patch:-0}
          # strip any pre-release suffix from patch
          patch="${patch%%-*}"
          patch=$((patch + 1))
          version="${major}.${minor}.${patch}"
          tag="v${version}"

          # Collision guard
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release ${tag}

          Automated patch release from main (${GITHUB_SHA}).
          API image: ghcr.io/nethub-ltd/netpay:${tag}
          Frontend image: ghcr.io/nethub-ltd/netpay-frontend:${tag}"

          git push origin "$tag"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Created and pushed ${tag}"

  docker:
    needs: [version]
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/nethub-ltd/netpay" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend Docker metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nethub-ltd/netpay-frontend
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push Next.js frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [version, docker]
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## NetPay ${{ needs.version.outputs.tag }}

            Automated release from `main` (patch bump). Changelog below is generated from commits since the previous tag.

            ### Container image

            Multi-arch (`linux/amd64`, `linux/arm64`):

            ```text
            ghcr.io/nethub-ltd/netpay:${{ needs.version.outputs.tag }}
            ghcr.io/nethub-ltd/netpay:${{ needs.version.outputs.version }}
            ghcr.io/nethub-ltd/netpay:latest
            ghcr.io/nethub-ltd/netpay-frontend:${{ needs.version.outputs.tag }}
            ghcr.io/nethub-ltd/netpay-frontend:${{ needs.version.outputs.version }}
            ghcr.io/nethub-ltd/netpay-frontend:latest
            ```

            Build and deploy the API and frontend images as a compatible pair. Configure the required runtime secrets and service topology described in deploy/README.md. Do not run the API image as a standalone SQLite application.

            - API: `ghcr.io/nethub-ltd/netpay:${{ needs.version.outputs.tag }}`
            - Next.js frontend: `ghcr.io/nethub-ltd/netpay-frontend:${{ needs.version.outputs.tag }}`

            Health: API `/health/live` and `/health/ready`; frontend `/login/` and `/api/auth/status`. Run `alembic upgrade head` once against the target PostgreSQL database before starting API replicas.

            ### Notes

            - User authentication uses server-side OIDC with Zitadel/NetHubKe and a mandatory Next.js BFF. See `docs/identity-nethub-rs.md`.
            - To skip the next automated release, include `[skip release]` in the merge commit message on `main`.
