name: Image

# Fast path: on push to main, build and push a single-arch image to GHCR.
# SPA OIDC is configured at *runtime* via OIDC_* env (GET /config.json).
# Optional Docker build-args still accept OIDC_* for baked defaults; they are not required.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-main
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Pytest
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/test.db
          REDIS_REQUIRED: "false"
          SECRET_KEY: test-secret
          ENVIRONMENT: test
        run: |
          mkdir -p data static
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci --prefer-offline=false

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Static path check
        run: test -f dist/index.html

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/nethub-ltd/netpay" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Optional baked defaults — runtime OIDC_* on the container is preferred.
          build-args: |
            OIDC_ISSUER=${{ vars.OIDC_ISSUER }}
            OIDC_CLIENT_ID=${{ vars.OIDC_CLIENT_ID }}
            OIDC_REDIRECT_URI=${{ vars.NETPAY_OIDC_REDIRECT_URI }}
            OIDC_SCOPES=${{ vars.OIDC_SCOPES }}
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
