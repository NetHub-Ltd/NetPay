name: Frontend build

on:
  pull_request:
    branches: [main, dev, "work/minimal-netpay-rebuild"]
  push:
    branches: [dev, "work/**", "chore/**", "fix/**", "feat/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SITE_URL: https://pay.nethub.co.ke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --no-audit --no-fund
      - name: Build production Next.js server
        run: npm run build
      - name: Verify standalone runtime output
        run: |
          test -s .next/standalone/server.js
          test -d .next/static
          test ! -d out
