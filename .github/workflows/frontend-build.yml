name: Frontend build

on:
  pull_request:
    branches: [main, dev, "work/minimal-netpay-rebuild"]
  push:
    branches: [dev, "work/**", "chore/**", "fix/**", "feat/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SITE_URL: https://pay.nethub.co.ke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Strict TypeScript check
        run: npm run typecheck
      - name: Frontend security helper tests
        run: npm test
      - name: Build production Next.js application
        run: npm run build
      - name: Smoke test the production Next.js server
        run: |
          set -euo pipefail
          npm run start > /tmp/netpay-next.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/login/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/netpay-next.log
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:3000/robots.txt >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/sitemap.xml >/dev/null
