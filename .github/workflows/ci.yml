name: CI

# Test, lint, and frontend build on PRs and branch pushes.
# Container images and GitHub Releases are handled by release.yml (main only).

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, "work/**", "chore/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Pytest
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/test.db
          SECRET_KEY: test-secret
          CREDENTIAL_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          ENVIRONMENT: test
        run: |
          mkdir -p data static
          alembic upgrade head
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Static path check
        run: test -f out/index.html
