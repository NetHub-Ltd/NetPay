name: CI

# Verify fresh backend startup, frontend quality, and production image startup.

on:
  pull_request:
    branches: [main, dev, "work/minimal-netpay-rebuild"]
  push:
    branches: [main, dev, "work/**", "chore/**", "fix/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-rebuild
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and fresh test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Startup smoke tests (fresh suite only)
        run: pytest -q smoke_tests/test_startup.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Static path check
        run: test -f out/index.html

  container:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image for startup smoke test (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/nethub-ltd/netpay:ci
      - name: Run image startup smoke test
        run: bash backend/scripts/container_startup_smoke.sh
