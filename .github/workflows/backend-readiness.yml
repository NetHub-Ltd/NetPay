name: Backend readiness

# Proves the API boots against real Postgres + Redis and answers /health.
# Unit tests stay in ci.yml (SQLite). This job is the production-like smoke.
#
# No long-lived secrets are hardcoded: ephemeral keys are generated per run.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: backend-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start-and-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netpay
          POSTGRES_DB: netpay
          # CI only — no password so scanners do not flag workflow credentials
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netpay -d netpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ENVIRONMENT: test
      REDIS_REQUIRED: "true"
      OPENAPI_ENABLED: "false"
      # Identity flag only — /health does not call this URL
      NETHUB_API_BASE_URL: https://api.example.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ephemeral runtime config
        # Generate per-run keys so nothing secret is committed or static in YAML.
        run: |
          set -euo pipefail
          {
            echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
            echo "INTERNAL_API_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
            # CI-only credentials for the service container (not production).
            echo "DATABASE_URL=postgresql+asyncpg://netpay@127.0.0.1:5432/netpay"
            echo "REDIS_URL=redis://127.0.0.1:6379/0"
          } >> "$GITHUB_ENV"

      - name: Install backend
        run: |
          pip install -U pip
          pip install -e ".[dev]"
          # Alembic uses sync SQLAlchemy URL (postgresql://) — requires psycopg2.
          # Editable install can miss the binary wheel on some runners; install explicitly.
          pip install "psycopg2-binary>=2.9.9"
          python -c "import psycopg2, asyncpg; print('psycopg2', psycopg2.__version__, 'asyncpg ok')"

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if python -c "import psycopg2; psycopg2.connect(host='127.0.0.1', port=5432, user='netpay', dbname='netpay').close(); print('postgres up')"; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready"
          exit 1

      - name: Migrate schema
        run: |
          set -euo pipefail
          mkdir -p data static
          echo "Using DATABASE_URL host=$(python -c "from urllib.parse import urlparse; import os; u=urlparse(os.environ['DATABASE_URL'].replace('+asyncpg','')); print(u.hostname, u.port, u.path)")"
          alembic upgrade head

      - name: Start API
        run: |
          set -euo pipefail
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/netpay-uvicorn.log 2>&1 &
          echo $! > /tmp/netpay-uvicorn.pid
          sleep 2
          if ! kill -0 "$(cat /tmp/netpay-uvicorn.pid)" 2>/dev/null; then
            echo "uvicorn failed to start"
            cat /tmp/netpay-uvicorn.log
            exit 1
          fi

      - name: Wait for /health (liveness + dependency readiness)
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if ! kill -0 "$(cat /tmp/netpay-uvicorn.pid)" 2>/dev/null; then
              echo "uvicorn exited early"
              cat /tmp/netpay-uvicorn.log || true
              exit 1
            fi
            if curl -sfS "http://127.0.0.1:8000/health" -o /tmp/health.json; then
              echo "Attempt $i — health response:"
              cat /tmp/health.json
              python3 - <<'PY'
          import json, sys
          h = json.load(open("/tmp/health.json"))
          ok = (
              h.get("status") == "ok"
              and h.get("database") is True
              and h.get("redis") == "ok"
              and h.get("admin_ready") is True
          )
          if not ok:
              print("Health not ready yet:", h)
              sys.exit(1)
          print("Health OK:", h)
          PY
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for /health"
          cat /tmp/netpay-uvicorn.log || true
          exit 1

      - name: Assert OpenAPI disabled when OPENAPI_ENABLED=false
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/openapi.json" || true)
          echo "openapi.json HTTP $code"
          test "$code" = "404"

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/netpay-uvicorn.pid ]; then
            kill "$(cat /tmp/netpay-uvicorn.pid)" 2>/dev/null || true
          fi
          cat /tmp/netpay-uvicorn.log || true
