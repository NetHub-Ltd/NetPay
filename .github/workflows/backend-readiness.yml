name: Backend readiness

# Bootstrap-stage API startup check. Database and Redis checks are deferred to the database PR.

on:
  pull_request:
    branches: [main, dev, "work/minimal-netpay-rebuild"]
  push:
    branches: [main, dev, "work/**", "chore/**", "fix/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: backend-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start-and-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and smoke-test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify startup and health endpoints
        run: pytest -q smoke_tests/test_startup.py
      - name: Verify production ASGI server starts
        run: |
          set -euo pipefail
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/netpay-uvicorn.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            cat /tmp/netpay-uvicorn.log || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "uvicorn exited before becoming ready"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for the API"
          exit 1
