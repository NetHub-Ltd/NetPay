name: Backend readiness

# Production-like startup check against real PostgreSQL and Redis.
# Deliberately does not run migrations; schema rollout is a separate phase.

on:
  pull_request:
    branches: [main, dev, "work/minimal-netpay-rebuild"]
  push:
    branches: [main, dev, "work/**", "chore/**", "fix/**"]

permissions:
  contents: read

concurrency:
  group: backend-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start-and-health:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost:5432/gateway
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: startup-readiness-test-only
      LOG_LEVEL: INFO

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify PostgreSQL connectivity
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg
          import os

          async def main():
              connection = await asyncpg.connect(os.environ["DATABASE_URL"])
              try:
                  value = await connection.fetchval("SELECT 1")
                  assert value == 1
                  print("PostgreSQL connectivity verified")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Verify Redis connectivity
        run: |
          python - <<'PY'
          import asyncio
          import os
          from redis.asyncio import Redis

          async def main():
              client = Redis.from_url(os.environ["REDIS_URL"])
              try:
                  assert await client.ping()
                  print("Redis connectivity verified")
              finally:
                  await client.aclose()

          asyncio.run(main())
          PY

      - name: Start API
        run: |
          set -euo pipefail
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/netpay-uvicorn.log 2>&1 &
          echo $! > /tmp/netpay-uvicorn.pid

      - name: Verify application startup and health endpoints
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if ! kill -0 "$(cat /tmp/netpay-uvicorn.pid)" 2>/dev/null; then
              echo "uvicorn exited before becoming ready"
              cat /tmp/netpay-uvicorn.log
              exit 1
            fi

            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
              echo
              grep -q "Database connectivity verified" /tmp/netpay-uvicorn.log
              grep -q "Redis connectivity verified" /tmp/netpay-uvicorn.log
              echo "API startup and dependency checks verified"
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for the API"
          cat /tmp/netpay-uvicorn.log
          exit 1

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/netpay-uvicorn.pid ]; then
            kill "$(cat /tmp/netpay-uvicorn.pid)" 2>/dev/null || true
          fi
          cat /tmp/netpay-uvicorn.log || true
